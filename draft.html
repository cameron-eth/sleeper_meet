<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Draft Room — Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=26" />
</head>
<body>
  <div class="stage">

    <!-- DRAFT ROOM -->
    <section id="room" class="room">

      <!-- HEADER STRIP -->
      <header class="room-head">
        <button id="back" class="back" title="Back to leagues">←</button>
        <div class="head-meta">
          <div class="league-name" id="leagueName">—</div>
          <div class="draft-meta" id="draftMeta">—</div>
        </div>
        <div class="head-status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">connecting…</span>
          <button id="muteBtn" class="mute" title="Toggle sound">🔊</button>
        </div>
      </header>

      <!-- ON THE CLOCK MAIN PANEL -->
      <div class="main-grid">
        <div class="clock-card" id="clockCard">
          <div class="clock-top">
            <div class="clock-top-left">
              <div class="round-chip" id="roundChip">RND —</div>
              <div class="value-badge" id="onClockValue" hidden></div>
            </div>
            <div class="pick-chip" id="pickChip">PICK —</div>
          </div>

          <!-- Empty state when nothing has been picked yet -->
          <div class="onclock" id="onClockBlock">
            <div class="onclock-label">ON THE CLOCK</div>
            <div class="team-row">
              <img id="onClockAvatar" class="team-avatar" alt="" />
              <div class="team-text">
                <div class="team-name" id="onClockName">—</div>
                <div class="team-sub" id="onClockSub">slot —</div>
              </div>
            </div>
            <div class="countdown" id="countdown">— : —</div>
          </div>

          <!-- Last pick reveal -->
          <div class="last-pick" id="lastPickBlock" hidden>
            <div class="last-pick-info">
              <div class="last-pick-label">WITH THE <span id="lpPickNo">—</span> PICK</div>
              <div class="last-pick-team">
                <img id="lpAvatar" class="team-avatar small" alt="" />
                <div id="lpTeam">—</div>
                <span id="lpTrade" class="trade-tag" hidden>VIA TRADE</span>
                <div class="last-pick-selects">SELECTS</div>
              </div>
              <div class="player-card" id="playerCard">
                <div class="player-pos" id="playerPos">—</div>
                <div class="player-name">
                  <span class="first" id="playerFirst">—</span>
                  <span class="last" id="playerLast">—</span>
                </div>
                <div class="player-meta" id="playerMeta">—</div>
              </div>
            </div>
          </div>
        </div>

        <!-- RECENT PICKS TICKER -->
        <aside class="recent">
          <div class="recent-head" id="recentHead">RECENT PICKS</div>
          <ol class="recent-list" id="recentList"></ol>
        </aside>
      </div>

      <!-- DRAFT BOARD + BEST AVAILABLE -->
      <div class="lower-grid">
        <section class="board-wrap">
          <div class="board-head">
            <div>DRAFT BOARD</div>
            <div class="board-legend" id="boardLegend"></div>
          </div>
          <div class="board" id="board"></div>
        </section>

        <aside class="available">
          <div class="available-head">
            <span>BEST AVAILABLE</span>
            <span class="available-count" id="availCount"></span>
          </div>
          <ol class="available-list" id="availableList"></ol>
        </aside>
      </div>

      <!-- FLASH OVERLAY -->
      <div class="flash" id="flash"></div>
    </section>

    <!-- VIDEO LIGHTBOX (pick reveal + click a best-available player). Player stays mounted so it keeps its sound permission. -->
    <div class="video-modal" id="videoModal">
      <div class="video-modal-backdrop" id="videoModalBackdrop"></div>
      <div class="video-modal-box">
        <button class="video-modal-close" id="videoModalClose" title="Close">✕</button>
        <div class="video-modal-title" id="videoModalTitle"></div>
        <div class="video-modal-frame"><div id="ytplayer"></div></div>
        <button class="video-modal-unmute" id="videoModalUnmute" hidden>🔊 Tap for sound</button>
      </div>
    </div>

  </div>

  <audio id="chime" src="chime.mp3" preload="auto"></audio>
  <script src="app.js?v=26"></script>
</body>
</html>
